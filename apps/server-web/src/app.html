<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script id="theme-init">try{const p=localStorage.getItem('memedock.theme');document.documentElement.dataset.theme=p==='dark'||(p!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}catch{document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}</script>
    <script id="lang-init">try{const l=localStorage.getItem('memedock.language');const lang=l==='zh'||l==='en'?l:((navigator.language||'').toLowerCase().startsWith('zh')?'zh':'en');document.documentElement.lang=lang==='zh'?'zh-CN':'en'}catch{}</script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div>%sveltekit.body%</div>
  </body>
</html>
