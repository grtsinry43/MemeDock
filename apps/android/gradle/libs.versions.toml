[versions]
materialSymbols = "2.2.1"
datastore = "1.2.1"
agp = "9.3.3"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.10.0"
coil = "3.3.0"
activityCompose = "1.12.4"
kotlin = "2.2.10"
composeBom = "2026.02.01"
jna = "5.19.1"
coroutines = "1.11.0"
ndk = "28.2.13676358"
