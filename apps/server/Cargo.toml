[package]
name = "memedock-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
web = ["dep:rust-embed"]

[dependencies]
memedock-domain = { path = "../../crates/domain" }
memedock-storage = { path = "../../crates/storage" }
memedock-core = { path = "../../crates/core" }
memedock-api-contracts = { path = "../../crates/api-contracts" }
axum = "=0.8.9"
tower-sessions = { version = "=0.15.0", default-features = false, features = ["axum-core"] }
async-trait = "=0.1.92"
argon2 = "=0.6.0"
getrandom = "=0.4.3"
subtle = "=2.6.1"
rpassword = "=7.5.4"
rust-embed = { version = "=8.13.0", optional = true }
time = { version = "=0.3.55", features = ["serde", "formatting"] }
tokio = { workspace = true, features = ["macros", "net", "signal", "io-util", "fs"] }
tokio-util = { version = "=0.7.19", features = ["io"] }
futures-util = "=0.3.34"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true

[dev-dependencies]
image.workspace = true
reqwest = { workspace = true, features = ["cookies"] }
tempfile.workspace = true

[lints]
workspace = true
