# Isolated from the production workspace so a generator experiment cannot
# change the Android/macOS dependency resolution or production FFI contract.
[workspace]
members = ["bindgen", "probe"]
resolver = "3"

[workspace.dependencies]
uniffi = "=0.32.2"
uniffi_bindgen = "=0.32.2"
uniffi_meta = "=0.32.2"
uniffi_udl = "=0.32.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
