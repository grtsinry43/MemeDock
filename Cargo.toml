[workspace]
members = ["crates/domain", "crates/storage", "crates/core", "crates/ffi", "tools/uniffi-bindgen", "tools/ffi-fixtures"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
uuid = { version = "=1.27.0", features = ["v7"] }
unicode-normalization = "=0.1.25"
fractional_index = { version = "=2.0.2", default-features = false }
serde_json = "=1.0.151"
sea-orm = { version = "=2.0.4", default-features = false, features = ["macros", "sqlx-sqlite", "runtime-tokio"] }
sea-orm-migration = { version = "=2.0.4", default-features = false, features = ["sqlx-sqlite", "runtime-tokio"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "sync", "time"] }
sha2 = { version = "=0.11.0", default-features = false }
tempfile = "=3.27.0"
uniffi = "=0.32.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
