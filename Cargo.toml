[workspace]
members = ["crates/domain", "crates/storage", "crates/core", "crates/ffi", "tools/uniffi-bindgen", "tools/ffi-fixtures", "apps/linux"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
uuid = { version = "=1.27.0", features = ["v7"] }
unicode-normalization = "=0.1.25"
fractional_index = { version = "=2.0.2", default-features = false }
serde_json = "=1.0.151"
sea-orm = { version = "=2.0.4", default-features = false, features = ["macros", "sqlx-sqlite", "runtime-tokio"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "sync", "time"] }
sha2 = { version = "=0.11.0", default-features = false }
tempfile = "=3.27.0"
uniffi = "=0.32.2"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rustix = { version = "=1.1.5", features = ["fs"] }
zip = { version = "=8.6.0", default-features = false }
gtk4 = { version = "=0.11.5", features = ["v4_22"] }
libadwaita = { version = "=0.9.2", features = ["v1_9", "gtk_v4_22"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
webpki-root-certs = "=1.0.9"
flate2 = "=1.1.10"
rlottie = { version = "=0.5.4", default-features = false, features = ["vendor-telegram"] }
webp-animation = "=0.10.0"
ffmpeg-next = { version = "=9.0.0", default-features = false, features = ["format", "software-scaling"] }
oo7 = { version = "=0.6.0", default-features = false, features = ["async-std", "native_crypto"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
