[workspace]
members = ["crates/domain"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
uuid = { version = "=1.27.0", features = ["v7"] }
unicode-normalization = "=0.1.25"
fractional_index = { version = "=2.0.2", default-features = false }
serde_json = "=1.0.151"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
