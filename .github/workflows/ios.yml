name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ inputs.release == true && 'release' || 'ci' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ inputs.release != true }}

env:
  CACHE_PREFIX: ${{ inputs.release == true && 'release' || 'ci' }}-ios-v2
  BUILD_PROFILE: ${{ inputs.release == true && 'release' || 'debug' }}
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read and validate version
        id: version
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          python=
          for candidate in python3.13 python3.12 python3.11 python3 python; do
            if command -v "$candidate" >/dev/null 2>&1 \
              && "$candidate" -c 'import tomllib' >/dev/null 2>&1; then
              python=$candidate
              break
            fi
          done
          if [[ -z $python ]]; then
            echo "Need Python >= 3.11 for tools/release/version.py (tomllib)." >&2
            exit 1
          fi
          "$python" tools/release/version.py --check --format github
      - name: Prepare Apple toolchain and native build tools
        id: toolchain
        env:
          RUST_VERSION: ${{ steps.version.outputs.rust }}
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
          for tool in cmake ninja nasm pkg-config; do
            if ! command -v "$tool" >/dev/null 2>&1; then brew install "$tool"; fi
          done
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim --toolchain "$RUST_VERSION"
          key=$({ uname -m; xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; xcrun --sdk iphonesimulator --show-sdk-version; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Cache native media
        with:
          path: |
            target/native-media/*/install
            target/native-media/*/complete
          key: ${{ env.CACHE_PREFIX }}-native-${{ steps.toolchain.outputs.key }}-${{ hashFiles('tools/native-media/**') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Cache Cargo dependencies and compiled artifacts
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/${{ env.BUILD_PROFILE }}
            target/aarch64-apple-darwin/debug
            target/aarch64-apple-ios-sim/debug
            target/aarch64-apple-ios/${{ env.BUILD_PROFILE }}
          key: ${{ env.CACHE_PREFIX }}-cargo-${{ steps.toolchain.outputs.key }}-${{ hashFiles('rust-toolchain.toml', '.cargo/**', 'tools/native-media/**', 'tools/ios/build-bridge.sh') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-cargo-${{ steps.toolchain.outputs.key }}-${{ hashFiles('rust-toolchain.toml', '.cargo/**', 'tools/native-media/**', 'tools/ios/build-bridge.sh') }}-${{ hashFiles('Cargo.lock') }}-
            ${{ env.CACHE_PREFIX }}-cargo-${{ steps.toolchain.outputs.key }}-${{ hashFiles('rust-toolchain.toml', '.cargo/**', 'tools/native-media/**', 'tools/ios/build-bridge.sh') }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Cache Xcode compilation and generated bridge
        with:
          path: |
            apps/ios/Generated
            apps/ios/build/DerivedData/Build
            apps/ios/build/DerivedData/ModuleCache.noindex
            apps/ios/build/DerivedData/SDKStatCaches.noindex
            apps/ios/build/DerivedData/SDKExplicitPrecompiledModules
          key: ${{ env.CACHE_PREFIX }}-xcode-${{ steps.toolchain.outputs.key }}-${{ hashFiles('apps/ios/MemeDock.xcodeproj/**', 'apps/ios/Configuration/*.xcconfig', 'tools/ios/**') }}-${{ github.sha }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-xcode-${{ steps.toolchain.outputs.key }}-${{ hashFiles('apps/ios/MemeDock.xcodeproj/**', 'apps/ios/Configuration/*.xcconfig', 'tools/ios/**') }}-
      - name: Select an available iPhone simulator
        if: inputs.release != true
        id: simulator
        run: |
          device=$(xcrun simctl list devices available --json | /usr/bin/python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(device["udid"] for runtime in devices.values() for device in runtime
                     if device["isAvailable"] and device["name"].startswith("iPhone")))')
          echo "destination=platform=iOS Simulator,id=$device" >> "$GITHUB_OUTPUT"
      - name: iOS simulator debug build and tests
        if: inputs.release != true
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: bash tools/ios/test.sh "$DESTINATION"
      - name: Build unsigned iOS device release
        if: inputs.release == true
        run: bash tools/ios/build.sh release device
      - name: Package and verify unsigned IPA
        if: inputs.release == true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash tools/ios/package.sh "$VERSION"
      - name: Upload iOS artifacts
        if: inputs.release == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-release
          path: target/distribution/ios/
          if-no-files-found: error
      - name: Upload iOS test results
        if: always() && inputs.release != true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-results
          path: apps/ios/build/TestResults/*.xcresult
          retention-days: 7
          if-no-files-found: ignore
