name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read and validate version
        id: version
        run: python3 tools/release/version.py --check --format github
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - name: Install native build dependencies and Rust
        env:
          RUST_VERSION: ${{ steps.version.outputs.rust }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake ninja-build nasm pkg-config
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
      - name: Install pinned Android SDK components
        run: |
          set +o pipefail
          yes 2>/dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'cmdline-tools;22.0'
          "$ANDROID_HOME/cmdline-tools/22.0/bin/sdkmanager" \
            'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/native-media
            target/tools
          key: android-native-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'tools/native-media/**', 'apps/android/gradle/libs.versions.toml') }}
      - name: Unit tests and debug bridge verification
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:verifyDebugBridge
      - name: Build and verify release bridge
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:assembleRelease :app:verifyReleaseBridge
      - name: Sign release APK
        if: inputs.release == true
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          : "${KEYSTORE_BASE64:?Set ANDROID_KEYSTORE_BASE64}"
          : "${KEYSTORE_PASSWORD:?Set ANDROID_KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?Set ANDROID_KEY_ALIAS}"
          : "${KEY_PASSWORD:?Set ANDROID_KEY_PASSWORD}"
          umask 077
          keystore="$RUNNER_TEMP/memedock-release.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          mkdir -p target/distribution/android
          apk="target/distribution/android/MemeDock-$VERSION-android-arm64.apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$apk" apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$tools/apksigner" verify --verbose "$apk"
          "$tools/zipalign" -c -P 16 -v 4 "$apk"
          analyzer="$ANDROID_HOME/cmdline-tools/22.0/bin/apkanalyzer"
          test "$("$analyzer" manifest version-name "$apk")" = "$VERSION"
          test "$("$analyzer" manifest version-code "$apk")" = "$VERSION_CODE"
      - name: Upload signed release
        if: inputs.release == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release
          path: target/distribution/android/*.apk
          if-no-files-found: error
      - name: Upload development builds
        if: inputs.release != true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-builds
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-reports
          path: |
            apps/android/app/build/reports/tests/
            apps/android/ffiContractTests/build/reports/tests/
          if-no-files-found: ignore
