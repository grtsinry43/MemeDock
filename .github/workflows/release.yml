name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release tag against monorepo version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          test "$REF_TYPE" = tag
          python3 tools/release/version.py --check --tag "$REF_NAME" --format github
  android:
    needs: version
    uses: ./.github/workflows/android.yml
    with:
      release: true
    secrets: inherit
  linux:
    needs: version
    uses: ./.github/workflows/linux.yml
    with:
      release: true
  draft:
    needs: [version, android, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-release'
          path: distribution
          merge-multiple: true
      - name: Create checksums and draft release
        working-directory: distribution
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          assets=(./*.apk ./*.pkg.tar.zst ./*.tar.gz ./MemeDock-*-linux-x86_64.tar.zst
                  ./*.PKGBUILD ./*.SRCINFO)
          sha256sum -- "${assets[@]}" | sed 's|  ./|  |' > SHA256SUMS
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > release-state; then
            test "$(cat release-state)" = true
            gh release upload "$RELEASE_TAG" "${assets[@]}" SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" SHA256SUMS --verify-tag --draft \
              --title "MemeDock $RELEASE_VERSION" --generate-notes
          fi
