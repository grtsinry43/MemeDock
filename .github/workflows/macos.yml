name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-${{ inputs.release == true && 'release' || 'ci' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ inputs.release != true }}

env:
  CACHE_PREFIX: ${{ inputs.release == true && 'release' || 'ci' }}-macos-v2
  BUILD_PROFILE: ${{ inputs.release == true && 'release' || 'debug' }}
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Read and validate version
        id: version
        run: |
          # tools/release/version.py reads TOML through tomllib, which needs
          # Python 3.11; the interpreter bundled with macOS is older, so the
          # Homebrew interpreters are searched explicitly.
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          python=
          for candidate in python3.13 python3.12 python3.11 python3 python; do
            if command -v "$candidate" >/dev/null 2>&1 \
              && "$candidate" -c 'import tomllib' >/dev/null 2>&1; then
              python=$candidate
              break
            fi
          done
          if [[ -z $python ]]; then
            echo "Need Python >= 3.11 for tools/release/version.py (tomllib)." >&2
            exit 1
          fi
          "$python" tools/release/version.py --check --format github
      - name: Identify Apple toolchain
        id: toolchain
        run: |
          key=$({ uname -m; xcodebuild -version; xcrun --sdk macosx --show-sdk-version; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Cache native media
        with:
          path: |
            target/native-media/*/install
            target/native-media/*/complete
            target/native-media/test-fixtures
          key: ${{ env.CACHE_PREFIX }}-native-${{ steps.toolchain.outputs.key }}-${{ hashFiles('tools/native-media/**') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Cache Cargo dependencies and compiled artifacts
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/${{ env.BUILD_PROFILE }}
            target/aarch64-apple-darwin/${{ env.BUILD_PROFILE }}
          key: ${{ env.CACHE_PREFIX }}-cargo-${{ steps.toolchain.outputs.key }}-${{ hashFiles('rust-toolchain.toml', '.cargo/**', 'tools/native-media/**') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-cargo-${{ steps.toolchain.outputs.key }}-${{ hashFiles('rust-toolchain.toml', '.cargo/**', 'tools/native-media/**') }}-${{ hashFiles('Cargo.lock') }}-
            ${{ env.CACHE_PREFIX }}-cargo-${{ steps.toolchain.outputs.key }}-${{ hashFiles('rust-toolchain.toml', '.cargo/**', 'tools/native-media/**') }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Cache Swift build artifacts
        with:
          path: apps/macos/.build
          key: ${{ env.CACHE_PREFIX }}-swift-${{ steps.toolchain.outputs.key }}-${{ hashFiles('apps/macos/Package.swift', 'tools/macos/**') }}-${{ github.sha }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-swift-${{ steps.toolchain.outputs.key }}-${{ hashFiles('apps/macos/Package.swift', 'tools/macos/**') }}-
      - name: Install Rust toolchain
        env:
          RUST_VERSION: ${{ steps.version.outputs.rust }}
        run: |
          rustup toolchain install "$RUST_VERSION" \
            --profile minimal --component rustfmt --component clippy
      - name: Fetch native media test fixtures
        run: bash tools/native-media/fetch-test-fixtures.sh
      - name: Rust formatting, check, Clippy and tests
        run: |
          # apps/linux is a workspace member that needs GTK4, which the macOS
          # image does not carry, so the crates that build here are named.
          packages=(-p memedock-domain -p memedock-storage -p memedock-core
                    -p memedock-ffi -p memedock-bindgen -p memedock-ffi-fixtures)
          cargo fmt --all -- --check
          cargo check "${packages[@]}" --locked
          cargo clippy "${packages[@]}" --all-targets --locked -- -D warnings
          cargo test "${packages[@]}" --locked
          # The animation conversions only run when the fixtures are present,
          # so they stay ignored everywhere else.
          cargo test -p memedock-core --locked sources::telegram::tests:: -- --ignored
      - name: Build macOS application
        run: bash tools/macos/build.sh "$BUILD_PROFILE"
      - name: macOS platform tests
        if: inputs.release != true
        run: |
          work="$GITHUB_WORKSPACE/target/aarch64-apple-darwin/debug"
          swift test --package-path apps/macos -c debug \
            -Xlinker "-L$work" -Xlinker -rpath -Xlinker "$work" \
            -Xlinker -rpath -Xlinker '@executable_path/../Frameworks'
      - name: Verify the bundle
        run: |
          bundle=apps/macos/Bundle/MemeDock.app
          plutil -lint "$bundle/Contents/Info.plist"
          test "$(lipo -archs "$bundle/Contents/MacOS/MemeDock")" = arm64
          test "$(lipo -archs "$bundle/Contents/Frameworks/libmemedock_ffi.dylib")" = arm64
          # `ld` and `dyld` reject an image whose LINKEDIT string pool is not
          # pointer aligned, and the linker emits it unaligned whenever the
          # indirect symbol table has an odd number of entries. Not every dyld
          # enforces that yet, so assert it instead of trusting the launch.
          for image in "$bundle/Contents/MacOS/MemeDock" \
                       "$bundle/Contents/Frameworks/libmemedock_ffi.dylib"; do
            stroff=$(otool -l "$image" \
              | awk '/LC_SYMTAB/{found=1} found && /stroff/{print $2; exit}')
            if (( stroff % 8 != 0 )); then
              echo "$image: string pool starts at $stroff, not pointer aligned" >&2
              exit 1
            fi
          done
          otool -L "$bundle/Contents/MacOS/MemeDock" \
            | grep -Fq '@rpath/libmemedock_ffi.dylib'
          # A copied bundle that still searches the build tree would run on this
          # machine and nowhere else.
          if otool -l "$bundle/Contents/MacOS/MemeDock" \
            | grep -qF "$GITHUB_WORKSPACE/target"; then
            echo "The bundle still searches the build tree for libraries" >&2
            exit 1
          fi
          codesign --verify --strict --verbose=2 "$bundle"
      - name: Launch the app once
        run: |
          bundle=apps/macos/Bundle/MemeDock.app
          log="$RUNNER_TEMP/memedock-launch.log"
          library="$HOME/Library/Application Support/MemeDock/sticker-library/library.sqlite"
          # A wrong rpath or a library that fails to load only shows up when the
          # app starts, so it is started for real, then asked to quit.
          "$bundle/Contents/MacOS/MemeDock" >"$log" 2>&1 &
          pid=$!
          # The first launch opens and initializes a library, which exercises
          # the bundled core and its schema end to end.
          for _ in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "The app exited during startup:" >&2
              cat "$log" >&2
              exit 1
            fi
            if [[ -f "$library" ]]; then break; fi
            sleep 1
          done
          if [[ ! -f "$library" ]]; then
            echo "The app never initialized a library:" >&2
            cat "$log" >&2
            exit 1
          fi
          kill -TERM "$pid"
          for _ in $(seq 1 15); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "The app ignored the quit signal" >&2
            kill -9 "$pid"
            exit 1
          fi
          if compgen -G "$HOME/Library/Logs/DiagnosticReports/MemeDock*" >/dev/null; then
            echo "A crash report was written:" >&2
            ls "$HOME/Library/Logs/DiagnosticReports/MemeDock"* >&2
            exit 1
          fi
      - name: Package
        if: inputs.release == true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          distribution="$GITHUB_WORKSPACE/target/distribution/macos"
          mkdir -p "$distribution"
          # ditto is the only archiver that keeps a bundle's metadata and
          # permissions intact.
          ditto -c -k --keepParent apps/macos/Bundle/MemeDock.app \
            "$distribution/MemeDock-$VERSION-macos-arm64.zip"
          cd "$distribution"
          shasum -a 256 ./*.zip > SHA256SUMS
      - name: Build the installer disk image
        if: inputs.release == true
        run: |
          # The zip above is the canonical artifact, matching the other platforms.
          # The dmg is what somebody on macOS expects to double-click, so it ships
          # beside it. Its window layout is written by dmgbuild straight into the
          # image's .DS_Store, which is why it can be laid out on a runner that has
          # no Finder session.
          distribution="$GITHUB_WORKSPACE/target/distribution/macos"
          bash packaging/macos/make-dmg.sh \
            apps/macos/Bundle/MemeDock.app \
            "$distribution/MemeDock-${{ steps.version.outputs.version }}-macos-arm64.dmg" \
            "MemeDock Installer"
          cd "$distribution"
          # The checksum file is rewritten so the dmg is covered too.
          shasum -a 256 ./*.zip ./*.dmg > SHA256SUMS
          cat SHA256SUMS
      - name: Verify the disk image
        if: inputs.release == true
        run: |
          # A dmg can be produced and be empty: dmgbuild copies into a mounted image,
          # and if that mount is refused the file still lands on disk. Assert the
          # payload is actually inside rather than trusting the build's exit status.
          distribution="$GITHUB_WORKSPACE/target/distribution/macos"
          dmg=$(ls "$distribution"/*.dmg)
          # hdiutil reports the partition scheme and the volume as two entities, and
          # only one of them carries a mount point, so it is looked for rather than
          # taken from a fixed index.
          plist=$(hdiutil attach -nobrowse -readonly -plist "$dmg" \
            | plutil -extract system-entities json -o - -)
          mount=$(printf '%s' "$plist" | /usr/bin/python3 -c \
            'import json,sys; print(next((e["mount-point"] for e in json.load(sys.stdin) if "mount-point" in e), ""))')
          if [[ -z $mount ]]; then
            echo "Could not read a mount point out of the image plist" >&2
            exit 1
          fi
          trap 'hdiutil detach -quiet "$mount"' EXIT
          test -d "$mount/MemeDock.app"
          test -L "$mount/Applications"
          test -f "$mount/.background.png"
          # The window's layout lives here; without it the volume opens on the
          # system's default icon view instead of the one the background implies.
          test -f "$mount/.DS_Store"
          codesign --verify --strict "$mount/MemeDock.app"
          ls -la "$mount"
      - name: Upload macOS artifacts
        if: inputs.release == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-release
          path: target/distribution/macos/
          include-hidden-files: true
          if-no-files-found: error
