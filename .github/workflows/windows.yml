name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read and validate version
        id: version
        run: python tools/release/version.py --check --format github
      - name: Report Windows toolchain
        run: |
          dotnet --list-sdks
          if (!(dotnet --list-sdks | Select-String -Pattern '^8\.0\.4\d{2}\s')) {
            throw 'No .NET 8.0.4xx SDK on this runner (apps/windows/global.json).'
          }
          cargo --version
          rustup toolchain list
          # tools/windows/build-bridge.ps1 binds through libclang.dll and defaults to
          # this directory; a missing LLVM is a runner problem, not a build bug.
          if (!(Test-Path -LiteralPath 'C:/Program Files/LLVM/bin/libclang.dll')) {
            throw 'LLVM is missing: libclang.dll not found under C:/Program Files/LLVM/bin.'
          }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/windows-native
            target/windows-compat
          key: windows-native-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'apps/windows/compatibility/Cargo.lock', 'tools/windows/**') }}
      - name: Install Rust toolchain
        env:
          RUST_VERSION: ${{ steps.version.outputs.rust }}
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal --component rustfmt --component clippy
          rustup target add x86_64-pc-windows-msvc --toolchain $env:RUST_VERSION
      - name: Build media dependencies, native library and UniFFI bindings
        run: ./tools/windows/build-bridge.ps1
      - name: Build WinUI application
        run: ./tools/windows/build.ps1 -SkipBridge -SkipEnvironmentCheck
      - name: Contract tests
        run: ./tools/windows/test-contracts.ps1 -SkipBuild
      - name: Interop probe
        run: ./tools/windows/test-interop.ps1
      - name: Bridge and recycle bin tests
        run: |
          # Run inside apps/windows so global.json selects the pinned 8.0.4xx SDK.
          Push-Location apps/windows
          try {
            dotnet run --project tests/MemeDock.Windows.Tests.csproj --configuration Release --no-launch-profile
            if ($LASTEXITCODE -ne 0) { throw "Bridge tests failed with exit code $LASTEXITCODE" }
          } finally { Pop-Location }
      - name: Package test build
        run: |
          $exe = Get-ChildItem -Path apps/windows/app/bin -Recurse -Filter MemeDock.Windows.exe |
            Select-Object -First 1
          if ($null -eq $exe) { throw 'MemeDock.Windows.exe was not produced.' }
          $output = 'target/distribution/windows'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          Compress-Archive -Path (Join-Path $exe.DirectoryName '*') `
            -DestinationPath (Join-Path $output 'MemeDock-Windows-x64.zip') -Force
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: target/distribution/windows
          if-no-files-found: error
