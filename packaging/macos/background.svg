<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <!-- The window behind the installer's two icons, 16:9. The grid is 20 to a cell and everything
       sits on its lines: the app centred at (160, 160) and Applications at (480, 160), in slots
       of 149, which macOS draws as 120 since the icon fills 824 of its 1024, so six cells with
       the app's edges on lines; the arrow between them on the line at 160 with its wings on
       crossings; the line of help at 325, clear of the names Finder draws under the icons.

       Finder lays a background picture over white whatever the system's appearance, and draws the
       icon names in black whatever the ground. So the ground here is light but not white, a card
       beside a dark system and plain beside a light one. A dark ground would look right in dark
       mode and break in light mode.

       The palette is the app's own: the brand mark's gradient, #3B86F7 to #1A5FD6. No double
       hyphens anywhere in this comment. They are illegal inside an XML comment and WebKit
       refuses the whole file, which shows up only as "cannot read" from render.swift. -->

  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f8"/>
      <stop offset="1" stop-color="#dde4ee"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 H0 V20" fill="none" stroke="#b7c2d4" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B86F7"/>
      <stop offset="1" stop-color="#1A5FD6"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#ground)"/>
  <rect width="640" height="360" fill="url(#grid)"/>

  <g fill="none" stroke="url(#brand)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M280 160 H360"/>
    <path d="M320 120 L360 160 L320 200"/>
  </g>

  <text x="320" y="325" text-anchor="middle" font-family="Kalam" font-size="17" fill="#5b6577">Drag MemeDock into Applications to install it.</text>
</svg>